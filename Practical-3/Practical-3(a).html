<!DOCTYPE html>
<html>
<head>
    <title>CSS Practical</title>

    <!-- Internal CSS -->
    <style>
        h2 {
            color: green;
            text-align: center;
        }

        p {
            font-size: 18px;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CSS Style Sheet Demonstration</h1>

    <!-- Inline CSS -->
    <p style="color: blue; font-weight: bold;">
        This paragraph uses Inline CSS.
    </p>

    <h2>This heading uses Internal CSS.</h2>

    <div class="external">
        This paragraph uses External CSS.
    </div>

</body>
</html>
